name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact existing published rudderanalytics version (validation only)
        required: true
        type: string
      commit:
        description: Exact release tag commit SHA (validation only)
        required: true
        type: string

permissions: {}

# Never cancel a live acceptance run: the central job must release its locks.
concurrency:
  group: publish-crates-io-${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Verify published release metadata
    if: >-
      (github.event_name == 'release' &&
       github.ref == format('refs/tags/{0}', github.event.release.tag_name) &&
       !github.event.release.prerelease && !github.event.release.draft) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # GitHub release lookup and checkout
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve trusted version checker before release checkout
        run: cp ./scripts/validate-release-tag.sh "$RUNNER_TEMP/validate-release-tag.sh"
      - name: Resolve existing published release and tag commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.commit }}
        run: bash ./scripts/resolve-release.sh
      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false
      - name: Verify Cargo metadata at the release commit
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          VERIFIED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          bash "$RUNNER_TEMP/validate-release-tag.sh"

  publish:
    name: Publish crate
    needs: metadata
    if: >-
      github.event_name == 'release' &&
      github.ref == format('refs/tags/{0}', github.event.release.tag_name) &&
      !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read # actions/checkout
      id-token: write # crates.io trusted publishing
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Recheck tag, checkout and crate version before publishing
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERIFIED_SHA: ${{ needs.metadata.outputs.sha }}
          VERIFIED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          remote="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          sha="$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref { print $1 }' <<< "$remote")"
          if [[ -z "$sha" ]]; then
            sha="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref { print $1 }' <<< "$remote")"
          fi
          test "$sha" = "$VERIFIED_SHA"
          bash ./scripts/validate-release-tag.sh
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  acceptance:
    name: Accept exact published crate (full E2E)
    needs: [metadata, publish]
    if: >-
      always() && needs.metadata.result == 'success' &&
      ((github.event_name == 'release' && needs.publish.result == 'success' &&
        github.ref == format('refs/tags/{0}', github.event.release.tag_name) &&
        !github.event.release.prerelease && !github.event.release.draft) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    # Leave room for registry propagation, the full central run, and live cleanup.
    timeout-minutes: 180
    environment: release
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # SDK-5961/SDK-5962 dependency: current shared action does not support
      # published package-version or an explicit release-origin source SHA.
      # Keep draft/inert until a reviewed SHA on main accepts both inputs.
      - name: Require reviewed published-mode action before acceptance
        run: |
          echo 'Blocked: SDK-5961/SDK-5962 must land and the shared action pin must be replaced.' >&2
          exit 1
      - name: Create central Actions-only token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rudder-sdk-e2e-tests
          permission-actions: write
      - name: Dispatch exact published crate and wait for full acceptance
        uses: rudderlabs/github-action-sdk-e2e@8fcd9661885616652b992c1fea8df5c2a163f6e2 # draft pin only; replace with reviewed SDK-5962 SHA
        with:
          token: ${{ steps.token.outputs.token }}
          suite: full
          package-version: ${{ needs.metadata.outputs.version }}
          source-sha: ${{ needs.metadata.outputs.sha }}

  release-status:
    name: Release acceptance status
    if: always()
    needs: [metadata, publish, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Report publication and acceptance separately
        env:
          EVENT_NAME: ${{ github.event_name }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          if [[ "$EVENT_NAME" == release && "$PUBLISH_RESULT" == success && "$ACCEPTANCE_RESULT" != success ]]; then
            echo 'Crate published, but exact public-package full E2E acceptance failed or was cancelled.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$METADATA_RESULT" != success || "$ACCEPTANCE_RESULT" != success ]]; then
            echo 'Release acceptance incomplete; do not announce release completion. No automatic unpublish.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$EVENT_NAME" == release && "$PUBLISH_RESULT" != success ]] ||
             [[ "$EVENT_NAME" == workflow_dispatch && "$PUBLISH_RESULT" != skipped ]]; then
            echo 'Unexpected publication state.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Exact published-package full E2E acceptance completed.' >> "$GITHUB_STEP_SUMMARY"
